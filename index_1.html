<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sitedesk</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15586E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sitedesk">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#DBE1E9;
  --text:#141A21; --text-2:#576373; --text-3:#89939F;
  --accent:#15586E; --accent-2:#2A8AA8; --accent-soft:#E1EFF4;
  --red:#B0231C; --red-soft:#FBE8E6;
  --amber:#94590B; --amber-soft:#FBEFD9;
  --green:#1C6B43; --green-soft:#E2F1E8;
  --shadow:0 1px 2px rgba(20,26,33,.05), 0 6px 16px -8px rgba(20,26,33,.18);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","IBM Plex Sans",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1217; --surface:#161D25; --surface-2:#1C252E; --line:#2A343F;
    --text:#E7EDF3; --text-2:#9BA8B5; --text-3:#6D7B89;
    --accent:#4FAECD; --accent-2:#7CCBE4; --accent-soft:#123240;
    --red:#F08A80; --red-soft:#3B1C19;
    --amber:#E2A85C; --amber-soft:#382810;
    --green:#6BC391; --green-soft:#123020;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface);box-shadow:0 0 0 1px var(--line)}

/* login */
.login{max-width:400px;margin:0 auto;padding:56px 22px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.login .mark{width:52px;height:52px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:24px;margin-bottom:18px}
.login h1{font-family:var(--cond);font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:.01em}
.login p.lead{color:var(--text-2);margin:0 0 26px;font-size:14px}
.msg{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;display:none}
.msg.err{display:block;background:var(--red-soft);color:var(--red)}
.msg.ok{display:block;background:var(--green-soft);color:var(--green)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.mark-sm{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;flex:none}
.title-wrap{flex:1;min-width:0}
h1.app{margin:0;font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.1}
.sub{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}

.tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;background:none;border:0;padding:10px 4px;font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.summary{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface-2)}
.stat{padding:9px 6px 10px;text-align:center;border:0;border-right:1px solid var(--line);cursor:pointer;background:none}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--cond);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.stat.is-red b{color:var(--red)} .stat.is-amber b{color:var(--amber)}
.filters{display:flex;gap:7px;padding:11px 16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--text-2);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* list */
.list{padding:10px 12px 110px;display:flex;flex-direction:column;gap:9px}
.card{position:relative;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px 11px 16px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.card.s-overdue::before{background:var(--red)}
.card.s-waiting::before{background:var(--amber)}
.card.s-done::before{background:var(--green)}
.card.s-open::before{background:var(--accent-2)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.32;text-wrap:balance}
.card.s-done h3{color:var(--text-2)}
.meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12.5px;color:var(--text-2)}
.tag{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text-2)}
.pill{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;white-space:nowrap;flex:none}
.p-open{background:var(--accent-soft);color:var(--accent)}
.p-waiting{background:var(--amber-soft);color:var(--amber)}
.p-progress{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--green-soft);color:var(--green)}
.due{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-3)}
.due.late{color:var(--red);font-weight:500}
.due.soon{color:var(--amber);font-weight:500}
.last{font-size:13px;color:var(--text-2);border-top:1px dashed var(--line);padding-top:7px;display:flex;gap:7px;align-items:baseline}
.last .when{font-family:var(--mono);font-size:11.5px;color:var(--text-3);flex:none}
.last p{margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.counts{display:flex;gap:11px;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.empty{padding:44px 20px;text-align:center;color:var(--text-3);font-size:14px}

.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}

.scrim{position:fixed;inset:0;background:rgba(9,14,19,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:94vh;background:var(--surface);border-radius:16px 16px 0 0;display:none;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet.on{display:flex}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 11px;border-bottom:1px solid var(--line);flex:none}
.sheet-head h2{margin:0;font-family:var(--cond);font-size:19px;font-weight:700}
.sheet-body{overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--text-3);cursor:pointer;padding:2px 6px}

.d-title{font-size:18px;font-weight:600;margin:9px 0;line-height:1.3;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;margin:12px 0 4px;border-top:1px solid var(--line);padding-top:12px}
.facts dt{font-family:var(--cond);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding-top:1px}
.facts dd{margin:0}
.facts .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{font-family:var(--cond);font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rail{position:relative;padding-left:19px;display:flex;flex-direction:column;gap:14px}
.rail::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--line)}
.ev{position:relative}
.ev::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent-2)}
.ev-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev-date{font-family:var(--mono);font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ev-how{font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.ev p{margin:3px 0 0;font-size:13.5px;color:var(--text-2)}
.ev .who{color:var(--text);font-weight:500}
.next{margin-top:5px;font-size:12.5px;background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:4px 8px;display:inline-block}
.cmt{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface-2);margin-bottom:8px}
.cmt-h{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.cmt-h b{font-weight:600}
.cmt-h span{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.cmt p{margin:3px 0 0;font-size:13.5px;color:var(--text-2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:9px;padding:11px 10px;font-family:var(--cond);font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn.solid{background:var(--accent);color:#fff}
.btn.wide{grid-column:1/-1}
.btn.ghost{border-color:var(--line);color:var(--text-2)}
.btn[disabled]{opacity:.55;cursor:default}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--cond);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:16px}
.field textarea{min-height:74px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text-2)}
.seg[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.note{font-size:12.5px;color:var(--text-3);margin:14px 0 0;line-height:1.5}
.offline{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--red);color:#fff;text-align:center;font-size:13px;padding:6px;display:none}
.offline.on{display:block}
</style>
</head>
<body>

<div class="offline" id="offline">No connection — changes can't be saved right now</div>

<!-- ============ LOGIN ============ -->
<div class="login" id="login" style="display:none">
  <div class="mark">SD</div>
  <h1>Sitedesk</h1>
  <p class="lead">Sign in with the email your partner account was created with.</p>
  <div class="msg" id="loginMsg"></div>
  <div class="field"><label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" inputmode="email" placeholder="you@company.com"></div>
  <div class="field"><label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
  <button class="btn solid wide" id="signin" style="grid-column:auto">Sign in</button>
  <p class="note">Forgotten your password? Ask Meet to reset it from the Supabase dashboard.</p>
</div>

<!-- ============ APP ============ -->
<div class="shell" id="app" style="display:none">
  <header class="top">
    <div class="bar">
      <div class="mark-sm">SD</div>
      <div class="title-wrap">
        <h1 class="app">Sitedesk</h1>
        <div class="sub" id="who"></div>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="tabs">
      <button class="tab" data-view="tasks" aria-pressed="true">Tasks</button>
      <button class="tab" data-view="trips" aria-pressed="false">Trips</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="filters" id="filters"></div>
  </header>
  <div class="list" id="list"><p class="empty">Loading…</p></div>
  <button class="fab" id="fab">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span id="fabLabel">New task</span>
  </button>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle">Task</h2>
    <button class="x" id="close" aria-label="Close">&times;</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   SETTINGS
   ============================================================ */
const SUPABASE_URL = "https://lnjgsanmdijjatbiyjik.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuamdzYW5tZGlqamF0Yml5amlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0Mjg5NDAsImV4cCI6MjEwNDAwNDk0MH0.2X4Lj5HN5Y2sTg6h_Oq-_ILvonOO7Nj0C5HHJqOLWUg";
const METHODS = ["call", "email", "letter", "visit", "whatsapp", "other"];
/* Sites and categories are no longer edited here — partners add their own
   from inside the app, and they're stored in the "sites" / "categories" tables. */
/* ============================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS = {
  open:     { label:"Not started",      cls:"p-open" },
  waiting:  { label:"Waiting on reply", cls:"p-waiting" },
  progress: { label:"In progress",      cls:"p-progress" },
  done:     { label:"Resolved",         cls:"p-done" }
};

let me = null, partners = [], tasks = [], trips = [], sitesList = [], categoriesList = [];
let view = "tasks", filter = "all";
const NEW_OPT = "__new__";

const $  = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const midnight = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const toDate  = s => s ? new Date(s + "T00:00:00") : null;
const daysTo  = s => { const d = toDate(s); return d ? Math.round((d - midnight())/86400000) : null; };
const fmt     = s => { const d = toDate(s); return d ? d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}) : "—"; };
const fmtFull = s => { const d = s ? new Date(s) : null;
  return d ? d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—"; };
const today   = () => new Date().toISOString().slice(0,10);
const ref     = t => "WT-" + String(t.id).padStart(4,"0");
const tripRef = t => "TR-" + String(t.id).padStart(4,"0");
const nameOf  = id => (partners.find(p => p.id === id) || {}).name || "—";

/* ---------- connection banner ---------- */
const setOffline = on => $("offline").classList.toggle("on", on);
window.addEventListener("online",  () => setOffline(false));
window.addEventListener("offline", () => setOffline(true));
setOffline(!navigator.onLine);

/* ---------- auth ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) { await enter(); } else { $("login").style.display = "flex"; }
}

$("signin").onclick = async () => {
  const btn = $("signin"), msg = $("loginMsg");
  const email = $("em").value.trim().toLowerCase(), password = $("pw").value;
  if (!email || !password) { msg.className = "msg err"; msg.textContent = "Enter your email and password."; return; }
  btn.disabled = true; btn.textContent = "Signing in…"; msg.className = "msg";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "Sign in";
  if (error) {
    msg.className = "msg err";
    msg.textContent = /invalid/i.test(error.message)
      ? "That email and password don't match. Check for typos, or ask Meet to reset it."
      : error.message;
    return;
  }
  $("login").style.display = "none";
  await enter();
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("signin").click(); });

async function enter(){
  const { data:{ user } } = await sb.auth.getUser();
  const { data: rows, error } = await sb.from("partners").select("*").order("name");
  if (error) { alert("Could not reach the database: " + error.message); return; }
  partners = rows || [];
  me = partners.find(p => p.id === user.id);
  if (!me) {
    $("login").style.display = "flex";
    $("loginMsg").className = "msg err";
    $("loginMsg").textContent = "This account isn't on the partner list. Ask Meet to add your email.";
    await sb.auth.signOut();
    return;
  }
  $("app").style.display = "block";
  $("who").textContent = me.name + " · " + partners.length + " partners";
  await Promise.all([loadLookups(), load(), loadTrips()]);
  live();
}

/* ---------- data ---------- */
async function loadLookups(){
  const [s, c] = await Promise.all([
    sb.from("sites").select("name").order("name"),
    sb.from("categories").select("name").order("name")
  ]);
  sitesList      = (s.data || []).map(r => r.name);
  categoriesList = (c.data || []).map(r => r.name);
}

async function load(){
  const { data, error } = await sb
    .from("tasks")
    .select("*, followups(*), comments(*), attachments(*)")
    .order("due_date", { ascending: true, nullsFirst: false });
  if (error) { if (view==="tasks") $("list").innerHTML = `<p class="empty">Could not load tasks.<br>${esc(error.message)}</p>`; return; }
  tasks = (data || []).map(t => ({
    ...t,
    followups: (t.followups || []).sort((a,b) => (a.happened_on > b.happened_on ? 1 : -1)),
    comments:  (t.comments  || []).sort((a,b) => (a.created_at  > b.created_at  ? 1 : -1))
  }));
  if (view === "tasks") render();
}

async function loadTrips(){
  const { data, error } = await sb.from("trips").select("*").order("from_date", { ascending: false });
  if (error) { if (view==="trips") $("list").innerHTML = `<p class="empty">Could not load trips.<br>${esc(error.message)}</p>`; return; }
  trips = data || [];
  if (view === "trips") render();
}

let reloadTimer = null;
function live(){
  sb.channel("sitedesk")
    .on("postgres_changes", { event:"*", schema:"public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(() => { loadLookups(); load(); loadTrips(); }, 400);
    })
    .subscribe();
}

/* ---------- derived: tasks ---------- */
const isOverdue = t => t.status !== "done" && t.due_date && daysTo(t.due_date) < 0;

function counts(){
  const open = tasks.filter(t => t.status !== "done");
  return {
    overdue: open.filter(isOverdue).length,
    week:    open.filter(t => t.due_date && daysTo(t.due_date) >= 0 && daysTo(t.due_date) <= 7).length,
    waiting: open.filter(t => t.status === "waiting").length,
    mine:    open.filter(t => t.owner_id === me.id).length
  };
}

function visibleTasks(){
  if (filter === "done") return tasks.filter(t => t.status === "done");
  const open = tasks.filter(t => t.status !== "done");
  if (filter === "overdue") return open.filter(isOverdue);
  if (filter === "waiting") return open.filter(t => t.status === "waiting");
  if (filter === "mine")    return open.filter(t => t.owner_id === me.id);
  if (filter === "week")    return open.filter(t => t.due_date && daysTo(t.due_date) >= 0 && daysTo(t.due_date) <= 7);
  return open;
}

function dueLabel(t){
  if (t.status === "done") return `<span class="due">closed</span>`;
  if (!t.due_date) return `<span class="due">no date</span>`;
  const n = daysTo(t.due_date);
  if (n < 0)   return `<span class="due late">${Math.abs(n)}d overdue</span>`;
  if (n === 0) return `<span class="due soon">due today</span>`;
  if (n <= 7)  return `<span class="due soon">due in ${n}d</span>`;
  return `<span class="due">due ${fmt(t.due_date)}</span>`;
}

/* ---------- derived: trips ---------- */
function visibleTrips(){
  if (filter === "upcoming") return trips.filter(t => daysTo(t.from_date) >= 0 || (t.to_date && daysTo(t.to_date) >= 0));
  if (filter === "mine")     return trips.filter(t => t.partner_id === me.id);
  return trips;
}
function tripWhen(t){
  const from = fmt(t.from_date), to = t.to_date && t.to_date !== t.from_date ? fmt(t.to_date) : null;
  return to ? `${from} – ${to}` : from;
}

function render(){

}

  $("filters").innerHTML = [
    ["all","All open"],["overdue","Overdue"],["waiting","Waiting"],

  ].map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");

  if (!rows.length) {

function renderTripsView(){

  $("filters").innerHTML = [

  ].map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");

      <button class="btn ghost" data-act="edit" data-id="${t.id}">Edit task</button>

        ? `<button class="btn ghost" data-act="done" data-id="${t.id}">Mark resolved</button>`
        : `<button class="btn ghost" data-act="reopen" data-id="${t.id}">Reopen</button>`}

async function handleNewOption(selectEl, listArr, table){
  const label = table === "sites" ? "site" : "category";
  const name = prompt(`Name the new ${label}:`);
  if (!name || !name.trim()) { selectEl.selectedIndex = 0; return; }
  const clean = name.trim();
  if (!listArr.includes(clean)) {
    const { error } = await sb.from(table).insert({ name: clean });
    if (error && !/duplicate/i.test(error.message)) { alert(error.message); selectEl.selectedIndex = 0; return; }
    listArr.push(clean); listArr.sort();
  }
  const isEdit = selectEl.id.startsWith("e-");
  selectEl.innerHTML = table === "sites" ? siteOptions(clean) : categoryOptions(clean);
}

/* ---------- events ---------- */
document.addEventListener("change", e => {
  if (e.target.id === "n-site" && e.target.value === NEW_OPT) handleNewOption(e.target, sitesList, "sites");
  if (e.target.id === "n-cat"  && e.target.value === NEW_OPT) handleNewOption(e.target, categoriesList, "categories");
  if (e.target.id === "t-site" && e.target.value === NEW_OPT) handleNewOption(e.target, sitesList, "sites");
});

document.addEventListener("click", async e => {
  const tabEl = e.target.closest(".tab");
  if (tabEl) {
    view = tabEl.dataset.view; filter = "all";
    [...document.querySelectorAll(".tab")].forEach(b => b.setAttribute("aria-pressed", b===tabEl));
    $("fabLabel").textContent = view === "tasks" ? "New task" : "New trip";
    render();
    return;
  }

  const seg = e.target.closest(".seg");
  if (seg) { [...seg.parentElement.children].forEach(b => b.setAttribute("aria-pressed","false"));
             seg.setAttribute("aria-pressed","true"); return; }

  const chip = e.target.closest(".chip, .stat");
  if (chip) { filter = chip.dataset.f; render(); window.scrollTo({ top:0, behavior:"smooth" }); return; }

  const card = e.target.closest(".card");
  if (card) {
    if (card.dataset.id) detail(card.dataset.id);
    if (card.dataset.trip) tripDetail(card.dataset.trip);
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const id = Number(act.dataset.id), a = act.dataset.act;

  if (a === "log")     return logForm(id);
  if (a === "comment") return commentForm(id);
  if (a === "edit")    return editForm(id);

  act.disabled = true;
  try {
    if (a === "done" || a === "reopen") {
      const { error } = await sb.from("tasks").update({ status: a === "done" ? "done" : "open" }).eq("id", id);
      if (error) throw error;
      await load(); closeSheet();
    }

    if (a === "save-log") {
      const { error } = await sb.from("followups").insert({
        task_id: id,
        happened_on: $("f-date").value || today(),
        method: segValue("#f-how"),
        person_contacted: $("f-who").value.trim() || null,
        response: $("f-note").value.trim() || null,
        next_action: $("f-next").value.trim() || null,
        next_action_date: $("f-nextdate").value || null,
        logged_by: me.id
      });
      if (error) throw error;
      const { error: e2 } = await sb.from("tasks").update({ status: $("f-status").value }).eq("id", id);
      if (e2) throw e2;
      await load(); detail(id);
    }

    if (a === "save-comment") {
      const body = $("c-text").value.trim();
      if (!body) throw new Error("Write something first.");
      const { error } = await sb.from("comments").insert({ task_id: id, body, author_id: me.id });
      if (error) throw error;
      await load(); detail(id);
    }

    if (a === "save-task") {
      const fields = taskFromForm();
      if (!fields.title) throw new Error("Give the task a title.");
      const { error } = await sb.from("tasks").insert({
        ...fields, created_by: me.id, status: "open"
      });
      if (error) throw error;
      filter = "all"; await load(); closeSheet();
    }

    if (a === "save-edit") {
      const fields = taskFromForm();
      if (!fields.title) throw new Error("Give the task a title.");
      const { error } = await sb.from("tasks").update(fields).eq("id", id);
      if (error) throw error;
      await load(); detail(id);
    }

    if (a === "save-trip") {
      const from = $("t-from").value;
      if (!from) throw new Error("Pick a start date.");
      const { error } = await sb.from("trips").insert({
        partner_id: $("t-partner").value,
        site: $("t-site").value,
        from_date: from,
        to_date: $("t-to").value || null,
        task_id: $("t-task").value ? Number($("t-task").value) : null,
        notes: $("t-notes").value.trim() || null,
        created_by: me.id
      });
      if (error) throw error;
      await loadTrips(); closeSheet();
    }

    if (a === "del-trip") {
      const { error } = await sb.from("trips").delete().eq("id", id);
      if (error) throw error;
      await loadTrips(); closeSheet();
    }
  } catch (err) { fail(err); }
  finally { act.disabled = false; }
});

      const last = t.followups[t.followups.length-1];
      const od = isOverdue(t) ? Math.abs(daysTo(t.due_date)) : 0;
      return [ref(t), t.title, t.site, t.category, nameOf(t.owner_id), STATUS[t.status].label,
              t.priority, t.due_date || "", od, t.followups.length,
              last ? last.happened_on : "", last ? (last.response || "") : ""];
    });
    const csv = [head, ...rows].map(r =>
      r.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }));
    a.download = "sitedesk-tasks-" + today() + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

boot();
</script>
</body>
</html>
